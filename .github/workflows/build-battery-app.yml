name: build-battery-app

on:
  push:
    branches: [main, "claude/samsung-battery-health-app-2v5o9a"]
    paths: ["samsung-battery-health/**", ".github/workflows/build-battery-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: samsung-battery-health
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryHealth-debug-apk
          path: samsung-battery-health/app/build/outputs/apk/debug/app-debug.apk
